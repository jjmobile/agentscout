# Standalone, hardened, read-only observer. Shares nothing with any other stack on the host.
services:
  agentscout:
    build:
      context: .
    image: agentscout:0.1.0a1
    container_name: agentscout-agent
    restart: unless-stopped
    read_only: true
    init: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 1.0
    mem_limit: 2g        # 256m OOM-looped on 2026-08-25 (~300k msgs/day); 1g was at the edge on 2026-08-26 with 361k identities
                         # in the window — since then only agents with >= SCOUT_SCORE_MIN_MSGS are materialised; 2g is headroom
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    env_file:
      - .env
    environment:
      AGENTSCOUT_DB: /data/agentscout.db
      AGENTSCOUT_IDENTITY_KEY: /data/identity.key
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_PUBLIC_BOT_TOKEN_FILE: /run/secrets/telegram_public_bot_token
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets:
      - telegram_bot_token
      - telegram_public_bot_token
      - anthropic_api_key
    networks:
      - agentscout_net
    volumes:
      - agentscout_data:/data
    # NO ports. NO docker socket. NO host bind mounts. NO external networks.

networks:
  agentscout_net:
    driver: bridge

volumes:
  agentscout_data:

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt          # operator alerts; may be empty to disable; git-ignored
  telegram_public_bot_token:
    file: ./secrets/telegram_public_bot_token.txt   # public command bot; may be empty to disable; git-ignored
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt           # Claude summaries (Milestone C); may be empty; git-ignored
