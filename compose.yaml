# Standalone, hardened, read-only observer. Shares nothing with any other stack on the host.
services:
  agentscout:
    build:
      context: .
    image: agentscout:0.1.0a1
    container_name: agentscout-agent
    restart: unless-stopped
    read_only: true
    init: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 0.5
    mem_limit: 256m
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    env_file:
      - .env
    environment:
      AGENTSCOUT_DB: /data/agentscout.db
      AGENTSCOUT_IDENTITY_KEY: /data/identity.key
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
    secrets:
      - telegram_bot_token
    networks:
      - agentscout_net
    volumes:
      - agentscout_data:/data
    # NO ports. NO docker socket. NO host bind mounts. NO external networks.

networks:
  agentscout_net:
    driver: bridge

volumes:
  agentscout_data:

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt   # create it (may be empty to disable Telegram); git-ignored
