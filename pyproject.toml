[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscout"
version = "0.1.0a1"
description = "AgentScout — observer of the Technocore agent network: signed census, deterministic scoring, daily digest, Telegram bots, optional Claude summaries"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    # Pinned on purpose: a rebuild must not pull code nobody reviewed. Bump deliberately; Dependabot alerts on CVEs.
    "cryptography==50.0.0",
    "pydantic==2.13.4",
    "anthropic==1.0.0; python_version >= '3.10'",    # what the Docker image (python:3.12) runs
    "anthropic==0.125.0; python_version < '3.10'",   # local dev on macOS system Python 3.9
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agentscout = "agentscout.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentscout = ["data/*.txt", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
